<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Gym Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff;
      --danger: #dc2626; --success: #16a34a; --muted: #6b7280;
      --bg: #f3f4f6; --card: #fff; --border: #e5e7eb; --text: #111827;
      --radius: 10px; --shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 400px; padding: 40px; }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .logo { font-size: 2.5rem; margin-bottom: 12px; }
    .login-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .login-header p { color: var(--muted); font-size: .9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: .85rem; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; transition: border .2s, box-shadow .2s; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .2s, transform .05s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { background: #fef2f2; color: var(--danger); padding: 12px; border-radius: 8px; font-size: .85rem; margin-bottom: 20px; display: none; }
    .error-msg.show { display: block; }
    .demo-accounts { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .demo-accounts h4 { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
    .demo-btn { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: .85rem; font-family: inherit; cursor: pointer; transition: background .2s; text-align: left; }
    .demo-btn:hover { background: var(--bg); }
    .demo-btn kbd { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: .75rem; margin-right: 8px; border: 1px solid var(--border); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid transparent; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { margin-top: 20px; text-align: center; font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🏋️</div>
      <h1>Gym Management</h1>
      <p>Đăng nhập để tiếp tục</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="admin / trainer1 / member1" />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="gym@2026" />
      </div>
      <button type="submit" class="btn btn-primary" id="btnLogin">
        <span class="spinner" id="loginSpinner" style="display:none"></span>
        <span id="btnText">Đăng nhập</span>
      </button>
    </form>

    <div class="demo-accounts">
      <h4>Tài khoản demo (mật khẩu: gym@2026)</h4>
      <button type="button" class="demo-btn" data-user="admin"><kbd>admin</kbd> SuperAdmin</button>
      <button type="button" class="demo-btn" data-user="trainer1"><kbd>trainer1</kbd> Huấn luyện viên</button>
      <button type="button" class="demo-btn" data-user="member1"><kbd>member1</kbd> Hội viên</button>
    </div>

    <div class="footer-note">Gym Management v1.0</div>
  </div>

  <script>
    const errorEl = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('loginSpinner');
    const form = document.getElementById('loginForm');

    // Demo account buttons
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('username').value = btn.dataset.user;
        document.getElementById('password').value = 'gym@2026';
      });
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Vui lòng nhập đầy đủ thông tin');
        return;
      }

      setLoading(true);
      hideError();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Đăng nhập thất bại');
        }

        // Lưu token và user info
        localStorage.setItem('accessToken', data.token);
        localStorage.setItem('user', JSON.stringify({
          userId: data.userId,
          username: data.username,
          role: data.role,
          memberId: data.memberId,
          trainerId: data.trainerId
        }));

        // Chuyển đến dashboard
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }
    function hideError() { errorEl.classList.remove('show'); }
    function setLoading(loading) {
      btnLogin.disabled = loading;
      btnText.textContent = loading ? 'Đang đăng nhập...' : 'Đăng nhập';
      spinner.style.display = loading ? 'inline-block' : 'none';
    }

    // Nếu đã có token thì redirect
    if (localStorage.getItem('accessToken')) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
