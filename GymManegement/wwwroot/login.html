<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Gym Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-200: #e9d5ff; --purple-300: #d8b4fe;
      --purple-400: #c084fc; --purple-500: #a855f7; --purple-600: #9333ea; --purple-700: #7e22ce;
      --purple-800: #6b21a8; --purple-900: #581c87;
      --primary: var(--purple-600); --primary-h: var(--purple-700); --primary-l: var(--purple-50);
      --success: #10b981; --success-l: #ecfdf5;
      --danger: #ef4444; --danger-l: #fef2f2;
      --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b;
      --gray-600: #475569; --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a; --gray-950: #020617;
      --bg: var(--gray-50); --card: var(--white); --text: var(--gray-900);
      --text-muted: var(--gray-500); --text-subtle: var(--gray-400);
      --border: var(--gray-200); --radius: 12px; --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.03), 0 1px 3px rgba(15,23,42,.05);
      --shadow-md: 0 4px 6px -1px rgba(15,23,42,.05), 0 2px 4px -2px rgba(15,23,42,.03);
      --shadow-lg: 0 10px 15px -3px rgba(15,23,42,.05), 0 4px 6px -4px rgba(15,23,42,.03);
      --shadow-xl: 0 25px 50px -12px rgba(15,23,42,.15);
      --ease: cubic-bezier(0.4,0,0.2,1); --dur-fast: 120ms; --dur-normal: 200ms;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: var(--gray-950); --card: var(--gray-900); --text: var(--gray-50);
        --text-muted: var(--gray-400); --text-subtle: var(--gray-500); --border: var(--gray-800); }
    }
    html { font-size: 14px; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xl); width: 100%; max-width: 420px; padding: 48px; animation: slideUp var(--dur-normal) var(--ease-out); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .login-header { text-align: center; margin-bottom: 40px; }
    .login-header .logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--purple-500), var(--purple-700)); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--white); margin-bottom: 20px; box-shadow: var(--shadow-md), 0 0 0 1px var(--purple-200); }
    .login-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; }
    .login-header p { color: var(--text-muted); font-size: 0.9375rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--text); margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit; background: var(--bg); color: var(--text); transition: all var(--dur-fast) var(--ease); }
    .form-group input::placeholder { color: var(--text-subtle); }
    .form-group input:hover { border-color: var(--gray-300); }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(147,51,234,0.15); }
    @media (prefers-color-scheme: dark) { .form-group input:hover { border-color: var(--gray-600); } }
    .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 0.9375rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all var(--dur-fast) var(--ease); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--white); box-shadow: var(--shadow-sm); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); box-shadow: var(--shadow-md); }
    .error-msg { background: var(--danger-l); color: var(--danger); padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.8125rem; margin-bottom: 20px; display: none; align-items: center; gap: 8px; animation: fadeIn var(--dur-fast) var(--ease-out); }
    .error-msg.show { display: flex; }
    .demo-accounts { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
    .demo-accounts h4 { font-size: 0.7rem; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
    .demo-btn { width: 100%; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.875rem; font-family: inherit; font-weight: 500; cursor: pointer; transition: all var(--dur-fast) var(--ease); display: flex; align-items: center; gap: 10px; color: var(--text); }
    .demo-btn:hover { background: var(--gray-100); border-color: var(--gray-300); }
    @media (prefers-color-scheme: dark) { .demo-btn:hover { background: var(--gray-800); border-color: var(--gray-700); } }
    .demo-btn kbd { background: var(--card); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; border: 1px solid var(--border); color: var(--primary); min-width: 56px; text-align: center; }
    .spinner { width: 20px; height: 20px; border: 2px solid transparent; border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { margin-top: 24px; text-align: center; font-size: 0.75rem; color: var(--text-subtle); }
    .footer-note a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🏋️</div>
      <h1>Gym Management</h1>
      <p>Đăng nhập để tiếp tục</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="admin / trainer1 / member1" />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="gym@2026" />
      </div>
      <button type="submit" class="btn btn-primary" id="btnLogin">
        <span class="spinner" id="loginSpinner" style="display:none"></span>
        <span id="btnText">Đăng nhập</span>
      </button>
    </form>

    <div class="demo-accounts">
      <h4>Tài khoản demo (mật khẩu: gym@2026)</h4>
      <button type="button" class="demo-btn" data-user="admin"><kbd>admin</kbd> SuperAdmin</button>
      <button type="button" class="demo-btn" data-user="trainer1"><kbd>trainer1</kbd> Huấn luyện viên</button>
      <button type="button" class="demo-btn" data-user="member1"><kbd>member1</kbd> Hội viên</button>
    </div>

    <div class="footer-note">Gym Management v2.0</div>
  </div>

  <script>
    const errorEl = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('loginSpinner');
    const form = document.getElementById('loginForm');

    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('username').value = btn.dataset.user;
        document.getElementById('password').value = 'gym@2026';
      });
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) { showError('Vui lòng nhập đầy đủ thông tin'); return; }

      setLoading(true); hideError();

      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Đăng nhập thất bại');
        localStorage.setItem('accessToken', data.token);
        localStorage.setItem('user', JSON.stringify({ userId: data.userId, username: data.username, role: data.role, memberId: data.memberId, trainerId: data.trainerId }));
        window.location.href = '/';
      } catch (err) { showError(err.message); }
      finally { setLoading(false); }
    });

    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); }
    function hideError() { errorEl.classList.remove('show'); }
    function setLoading(loading) { btnLogin.disabled = loading; btnText.textContent = loading ? 'Đang đăng nhập...' : 'Đăng nhập'; spinner.style.display = loading ? 'inline-flex' : 'none'; }

    if (localStorage.getItem('accessToken')) { window.location.href = '/'; }
  </script>
</body>
</html>
