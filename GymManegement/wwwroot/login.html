<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="gym-logo">💪</div>
                <h1>Gym Management</h1>
                <p>Quản lý phòng gym chuyên nghiệp</p>
            </div>
            
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required autocomplete="off">
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn-primary btn-block">Đăng nhập</button>
            </form>
            
            <div class="login-footer">
                <p>Hệ thống quản lý phòng gym hiện đại</p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if already logged in
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }
        
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            if (!username || !password) {
                errorDiv.textContent = 'Vui lòng nhập đầy đủ thông tin';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                errorDiv.style.display = 'none';
                const result = await login(username, password);
                
                if (result) {
                    // Redirect to main app
                    window.location.href = 'index.html';
                }
            } catch (error) {
                errorDiv.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
