<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="gym-logo">💪</div>
                <h2>Gym Manager</h2>
            </div>
            <nav id="sidebarNav" class="sidebar-nav">
                <!-- Navigation items will be dynamically generated based on role -->
            </nav>
        </aside>
        
        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top Header Bar -->
            <header class="top-header">
                <button id="menuToggle" class="menu-toggle">☰</button>
                <div class="header-info">
                    <span id="userInfo" class="user-info"></span>
                    <button id="changePasswordBtn" class="btn btn-sm btn-info" style="margin-right: 12px;">🔑 Đổi MK</button>
                    <button id="logoutBtn" class="btn-logout">Đăng xuất</button>
                </div>
            </header>
            
            <!-- Main Content -->
            <main id="main-content" class="main-content">
                <!-- Page content will be dynamically loaded here -->
            </main>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
    
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
    </div>
    
    <!-- Global Change Password Modal -->
    <div id="globalChangePasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Đổi Mật Khẩu</h3>
                <button class="modal-close" onclick="closeGlobalChangePasswordModal()">×</button>
            </div>
            <form id="globalChangePasswordForm">
                <div class="form-group">
                    <label>Mật khẩu cũ</label>
                    <input type="password" id="globalOldPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="globalNewPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu mới</label>
                    <input type="password" id="globalConfirmNewPassword" required minlength="6">
                </div>
                <div id="globalChangePasswordError" class="error-message" style="display: none;"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm" onclick="closeGlobalChangePasswordModal()">Hủy</button>
                    <button type="submit" class="btn btn-sm btn-primary">Đổi mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Load all JS files -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/members.js"></script>
    <script src="js/memberships.js"></script>
    <script src="js/trainers.js"></script>
    <script src="js/facilities.js"></script>
    <script src="js/schedules.js"></script>
    <script src="js/sessions.js"></script>
    <script src="js/checkins.js"></script>
    <script src="js/invoices.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/users.js"></script>
    <script src="js/profile.js"></script>
    
    <script>
        // Initialize app on page load
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        } else {
            initApp();
        }
        
        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', logout);
        
        // Change password handler
        document.getElementById('changePasswordBtn').addEventListener('click', showGlobalChangePasswordModal);
        document.getElementById('globalChangePasswordForm').addEventListener('submit', handleGlobalChangePassword);
        
        // Mobile menu toggle
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
        });
        
        // Global change password functions
        function showGlobalChangePasswordModal() {
            document.getElementById('globalChangePasswordModal').classList.add('show');
            document.getElementById('globalChangePasswordForm').reset();
            document.getElementById('globalChangePasswordError').style.display = 'none';
        }
        
        function closeGlobalChangePasswordModal() {
            document.getElementById('globalChangePasswordModal').classList.remove('show');
        }
        
        async function handleGlobalChangePassword(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('globalOldPassword').value;
            const newPassword = document.getElementById('globalNewPassword').value;
            const confirmPassword = document.getElementById('globalConfirmNewPassword').value;
            const errorDiv = document.getElementById('globalChangePasswordError');
            
            errorDiv.style.display = 'none';
            
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Mật khẩu xác nhận không khớp';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (newPassword.length < 6) {
                errorDiv.textContent = 'Mật khẩu mới phải có ít nhất 6 ký tự';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                showLoading();
                await apiFetch('/api/Auth/change-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        oldPassword,
                        newPassword
                    })
                });
                hideLoading();
                showToast('Đổi mật khẩu thành công', 'success');
                closeGlobalChangePasswordModal();
            } catch (error) {
                hideLoading();
                errorDiv.textContent = 'Đổi mật khẩu thất bại: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
